pipeline:
  - name: "speech_segmentation"
    params:
      min_duration: 3.2
      max_duration: 30.0
  - name: "speaker_segmentation"
    params:
      min_duration: 3.2

  # Annotate + filter: keep low-music segments, store the score
  - name: "music_detection"
    annotate: "music_prob"
    condition: "lambda x: x < 0.5"

  # Annotate + filter: store PESQ and drop noisy segments
  - name: "denoising"
    annotate: "pesq"
    condition: "lambda x: x > 3.3"

  # Pure annotation: store DNSMOS without filtering
  - name: "mos_filtering"
    annotate: "dnsmos"

  # Pure annotation: store rolloff frequency without filtering
  - name: "rolloff_filtering"
    annotate: "rolloff_hz"

  # Rich annotation: full language distribution, filter on English
  - name: "language_filtering"
    params:
      language_code: "en"
    annotate: "language"
    condition: "lambda x: x > 0.5"

  # Rich annotation: full accent distribution, no filtering
  - name: "accent_filtering"
    params:
      accent_label: "Egyptian"
    annotate: "accent"

  # Rich annotation: both transcripts + WER, filter on agreement
  - name: "asr_filtering"
    params:
      primary_model: "whisper"
      secondary_model: "voxtral"
      language: "en"
    annotate: "asr_agreement"
    condition: "lambda x: x == 0.0"

  # Annotation-only: single ASR transcription
  - name: "transcription"
    annotate: "transcript"
    params:
      model: "whisper"
      language: "en"
